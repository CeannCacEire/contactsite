<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genocchi</title>
<meta name="description" content="Contact Genocchi by email or phone.">
<meta name="theme-color" content="#111111">
<link rel="preload" href="fonts/cinzel-variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/merriweather-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23111111'/%3E%3Crect x='2.5' y='2.5' width='27' height='27' fill='none' stroke='%23ebebeb'/%3E%3Ctext x='16' y='22.5' font-family='Georgia,serif' font-size='18' text-anchor='middle' fill='%23ebebeb'%3EG%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">

  <header class="title">
    <p class="eyebrow">Contact Kevin</p>
    <h1>Genocchi</h1>
  </header>
  <div class="rule" aria-hidden="true"><span></span><i></i><span></span></div>

  <section class="contact" aria-label="Contact details">
    <div class="row">
      <p class="label">Email</p>
      <p class="value">kevin@genocchi.com</p>
      <a class="btn" href="mailto:kevin@genocchi.com">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3.5 6 8.5 7 8.5-7"/></svg>
        Send email
      </a>
    </div>
    <div class="row">
      <p class="label">Phone</p>
      <p class="value"><a href="tel:+353870080005">087 008 0005</a></p>
      <button class="btn" type="button" id="copy" data-number="087 008 0005">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="1"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>
        <span>Copy number</span>
      </button>
    </div>
  </section>
  <p class="status" id="status" role="status" aria-live="polite"></p>
</main>
<footer class="foot">
  <svg class="flag" viewBox="0 0 3 2" role="img" aria-label="Flag of Ireland"><rect width="1" height="2" fill="#169b62"/><rect x="1" width="1" height="2" fill="#ffffff"/><rect x="2" width="1" height="2" fill="#ff883e"/></svg>
  <p><time datetime="04:00">04:00</time>–<time datetime="21:00">21:00</time></p>
</footer>
<script>
const btn = document.getElementById('copy'), label = btn.querySelector('span'), status = document.getElementById('status');
btn.addEventListener('click', async () => {
  const n = btn.dataset.number;
  try { await navigator.clipboard.writeText(n); }
  catch { const t = document.createElement('textarea'); t.value = n; t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  btn.classList.add('done'); label.textContent = 'Copied'; status.textContent = 'Phone number copied to clipboard';
  clearTimeout(btn._t); btn._t = setTimeout(() => { btn.classList.remove('done'); label.textContent = 'Copy number'; status.textContent = ''; }, 2000);
});
</script>
</body>
</html>
